<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Žive Majice — Admin</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial;padding:30px}.box{max-width:900px;margin:auto;background:#151515;border:1px solid #333;padding:30px;border-radius:16px}h1{color:#ff5a1f}.notice{padding:15px;background:#21150f;border-left:4px solid #ff5a1f;color:#ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#0b0b0b;color:#fff;box-sizing:border-box}textarea{min-height:100px}.full{grid-column:1/-1}button{margin-top:20px;padding:13px 20px;background:#ff5a1f;border:0;font-weight:900;border-radius:8px}.back{display:inline-block;margin-bottom:25px;color:#ff5a1f}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="box"><a class="back" href="../">← Nazad na sajt</a><h1>ŽIVE MAJICE / ADMIN</h1><div class="notice"><b>Prva verzija panela.</b><br>Ovo je priprema za upravljanje proizvodima. Prava prijava i bezbedno čuvanje podataka napravićemo sledeće, pre nego što se panel koristi za stvarne kupce.</div><h2>Dodaj proizvod</h2><div class="grid"><div><label>Naziv</label><input placeholder="npr. Porsche GT 3 RS"></div><div><label>Cena (RSD)</label><input type="number" placeholder="1300"></div><div><label>Veličine</label><input placeholder="M, L, XL, XXL"></div><div><label>Boja</label><input placeholder="Crna"></div><div class="full"><label>Opis</label><textarea placeholder="Opis majice..."></textarea></div><div class="full"><label>Fotografija</label><input type="file" accept="image/*"></div></div><button>SAČUVAJ PROIZVOD — USKORO</button></div></body></html>
